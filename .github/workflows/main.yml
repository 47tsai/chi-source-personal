name: Chi Source Personal CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: chi-source-personal-ci
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip

      - name: Install deps
        run: pip install --disable-pip-version-check --no-input -r requirements.txt

      - name: Validate Python
        run: python -m py_compile update_source.py validate_source.py test_update_source.py test_validate_source.py

      - name: Run tests
        run: python -m pytest -q

      - name: Validate JSON
        run: |
          python -m json.tool apps.json > /dev/null
          python -m json.tool app_config.json > /dev/null
