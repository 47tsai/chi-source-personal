name: Chi Source Personal

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chi-source-personal
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: pip install --disable-pip-version-check --no-input -r requirements.txt
      - name: Validate Python
        run: python -m py_compile update_source.py validate_source.py test_update_source.py test_validate_source.py test_special_versions.py
      - name: Run tests
        run: python -m pytest -q
      - name: Validate JSON configuration
        run: python -m json.tool sources.json > /dev/null

  sync:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: pip install --disable-pip-version-check --no-input -r requirements.txt
      - name: Validate Python
        run: python -m py_compile update_source.py validate_source.py
      - name: Sync upstream app catalogs
        run: python update_source.py
      - name: Validate generated AltStore Source
        run: python validate_source.py
      - name: Check diff formatting
        run: git diff --check
      - name: Commit generated source
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "auto: sync Chi Source Personal apps"
          file_pattern: apps.json
